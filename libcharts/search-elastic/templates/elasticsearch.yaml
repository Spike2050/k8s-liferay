apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: {{ include "search-elastic.fullname" . }}
spec:
  version: {{ .Values.version | quote }}

  http:
    tls:
      selfSignedCertificate:
        disabled: true

  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
