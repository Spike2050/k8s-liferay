apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: {{ include "search-elastic.fullname" . }}
spec:
  version: {{ .Values.version | quote }}

  http:
    tls:
      selfSignedCertificate:
        disabled: true

  nodeSets:
    - name: default
      count: 1

      config:
        xpack.security.enabled: false
        xpack.security.transport.ssl.enabled: false
        discovery.type: single-node
        node.store.allow_mmap: false

      podTemplate:
        spec:
          initContainers:
            - name: install-plugins
              image: docker.elastic.co/elasticsearch/elasticsearch:{{ .Values.version }}
              command:
                - sh
                - -c
                - |
                  bin/elasticsearch-plugin install --batch analysis-icu
                  bin/elasticsearch-plugin install --batch analysis-kuromoji
                  bin/elasticsearch-plugin install --batch analysis-smartcn
                  bin/elasticsearch-plugin install --batch analysis-stempel
                  cp -R /usr/share/elasticsearch/plugins /mnt/plugins/
              volumeMounts:
                - name: plugins
                  mountPath: /mnt/plugins

          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"
              volumeMounts:
                - name: plugins
                  mountPath: /usr/share/elasticsearch/plugins

          volumes:
            - name: plugins
              emptyDir: {}

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
