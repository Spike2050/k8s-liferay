{{- if and .Values.enabled .Values.rootPassword.simple.enabled  }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-postgres.fullname" . }}-root
type: Opaque
stringData:
  username: {{ .Values.rootPassword.simple.username | quote }}
  password: {{ .Values.rootPassword.simple.password | quote }}
{{- end }}